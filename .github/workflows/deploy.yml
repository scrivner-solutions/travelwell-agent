name: Deploy (staging)

# THE deploy path for staging, and the only automated one. It holds WHEN to
# deploy and WHO deploys; it holds no gcloud commands at all.
#
# WHAT to deploy and HOW lives in infra/deploy-staging.sh and
# infra/deploy-frontend-staging.sh, which this workflow calls. Those same
# scripts are what a human runs by hand, so the two paths cannot drift: there
# is one implementation, not two that promise to match. An earlier version of
# this file re-declared every flag and had already drifted - --min-instances 0
# against the live 1, no --no-cpu-throttling, and no agent or Vertex settings.
#
# Config reaches the scripts the same way in both paths. Locally they source an
# untracked environment file (TRAVELWELL_STAGING_ENV, default
# ~/.travelwell-staging.env); here the `env:` block below plays that part,
# using the identical variable names. Every value in the scripts is
# ${VAR:-default}, and :- treats empty as unset, so a repository variable that
# is not set falls through to the script's own default rather than blanking it.
#
# DORMANT until GCP_PROJECT_ID, GCP_WIF_PROVIDER and GCP_DEPLOYER_SA exist as
# repository variables. Creating the Workload Identity pool needs project IAM
# the repo owner does not hold, so the deploy jobs are SKIPPED rather than
# failed: a red X on every merge trains people to ignore it. Setting the
# variables turns deploys on with no change to this file. OWNER.md #39 asked
# which of the two deploy paths survives; calling the scripts is that answer.

# Fires on every merge to main. The PR's own CI proved the branch; `gates`
# below re-runs it against the merge commit, which with merge-commit merges is
# a tree no pull_request run has ever seen.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two deploys at once: a second merge must not race a half-applied
# migration. Queue rather than cancel, so no merge is silently skipped.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

# The per-environment layer, and nothing else. These are exactly the names the
# scripts read, so this block is the CI equivalent of the untracked env file a
# human sources - not a second configuration system. Names that are the same in
# every environment live in infra/config.env, which the scripts source
# themselves; nothing shared belongs here.
#
# GOOGLE_CLIENT_ID is per-environment but not secret: it travels to Google in
# the redirect URL. The client secret is never passed here at all - the scripts
# reference it in Secret Manager by name.
env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_SQL_CONNECTION_NAME: ${{ vars.GCP_SQL_CONNECTION_NAME }}
  DB_TARGET: ${{ vars.DB_TARGET }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  AGENT_WORKER: ${{ vars.AGENT_WORKER }}

jobs:
  gates:
    name: Gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  preflight:
    name: Deploy credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Are the deploy variables set
        id: check
        env:
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          if [[ -n "$WIF" && -n "$DEPLOYER_SA" && -n "$GCP_PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Deploying ${GITHUB_SHA::7} to $GCP_PROJECT_ID." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped, gates still ran"
              echo
              echo "Set the repository variables \`GCP_PROJECT_ID\`, \`GCP_WIF_PROVIDER\`"
              echo "and \`GCP_DEPLOYER_SA\` to turn deploys on. Against Cloud SQL, set"
              echo "\`DB_TARGET\` and \`GCP_SQL_CONNECTION_NAME\` in the same pass: the"
              echo "scripts refuse rather than detaching a live instance."
              echo "See docs/GITHUB_ACTIONS_DEPLOYMENT.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  backend:
    name: Deploy backend
    needs: [gates, preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation (no stored keys)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authentication is the one thing that genuinely differs between a laptop
      # and CI, which is why it lives here and never in the scripts: they use
      # whatever gcloud is already logged in as. Locally that is a human.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Builds, pushes, migrates, deploys and smoke-tests /readyz. The script
      # tags the image from `git rev-parse --short HEAD` and builds from a
      # pristine export of HEAD, so the tag names exactly what was committed.
      - name: Deploy backend
        run: bash infra/deploy-staging.sh

  frontend:
    name: Deploy frontend
    needs: [backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # No BACKEND_URL is passed in: the script resolves it with
      # `gcloud run services describe`, which is why this job needs the backend
      # one rather than an output from it.
      - name: Deploy frontend
        run: bash infra/deploy-frontend-staging.sh
