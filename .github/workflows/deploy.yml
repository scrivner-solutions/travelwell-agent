name: Deploy (staging)

# Fires on every merge to main. The PR's own CI proved the branch; `gates`
# below re-runs it against the merge commit, which with merge-commit merges is
# a tree no pull_request run has ever seen.
#
# The deploy jobs are skipped, not failed, until the three GCP_* repository
# variables exist: creating the Workload Identity pool needs project IAM the
# repo owner does not hold, and a red X on every merge would train people to
# ignore it. Setting the variables turns deploys on with no change here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two deploys at once: a second merge must not race a half-applied
# migration. Queue rather than cancel, so no merge is silently skipped.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: us-central1
  AR_HOST: us-central1-docker.pkg.dev
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  RUNTIME_SA: travelwell-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  # DATABASE_URL alone selects the target (app/db/engine.py); Cloud SQL also
  # needs its instance attached to the revision. Both come from repo config so
  # that no environment is named here.
  DB_TARGET: ${{ vars.DB_TARGET || 'external' }}
  CLOUDSQL_INSTANCE: ${{ vars.GCP_SQL_CONNECTION_NAME }}

jobs:
  gates:
    name: Gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  preflight:
    name: Deploy credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Are the deploy variables set
        id: check
        env:
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          if [[ -n "$WIF" && -n "$DEPLOYER_SA" && -n "$PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Deploying ${GITHUB_SHA::7} to $PROJECT_ID." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped, gates still ran"
              echo
              echo "Set the repository variables \`GCP_PROJECT_ID\`, \`GCP_WIF_PROVIDER\`"
              echo "and \`GCP_DEPLOYER_SA\` to turn deploys on. Against Cloud SQL, set"
              echo "\`DB_TARGET\` and \`GCP_SQL_CONNECTION_NAME\` in the same pass: the"
              echo "default target refuses rather than detaching a live instance."
              echo "See docs/GITHUB_ACTIONS_DEPLOYMENT.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  backend:
    name: Deploy backend
    needs: [gates, preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation (no stored keys)
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "$AR_HOST" --quiet

      # Short SHA, matching the tags the manual deploys already put in the
      # registry. The checkout is the commit and nothing else, which is what
      # the local script's git-archive export buys by hand.
      - name: Resolve image tag
        run: |
          SHA=${GITHUB_SHA::7}
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "IMAGE=$AR_HOST/$PROJECT_ID/travelwell/backend:$SHA" >> "$GITHUB_ENV"

      # DB_TARGET is the one input with a default, and its default detaches
      # whatever the service has attached. Both halves fail silently at runtime,
      # so refuse before the build rather than after the revision serves.
      - name: Check database config
        run: |
          if [[ "$DB_TARGET" == cloudsql ]]; then
            if [[ -z "$CLOUDSQL_INSTANCE" ]]; then
              echo "DB_TARGET is cloudsql but GCP_SQL_CONNECTION_NAME is unset" >&2
              exit 1
            fi
            exit 0
          fi
          # A failed describe and a service with nothing attached both read as
          # the empty string, and only one of them is safe to deploy over. So an
          # unreadable attachment refuses; only a service that does not exist yet
          # goes through, because it has nothing to detach.
          if ! ATTACHED=$(gcloud run services describe travelwell-backend --region "$REGION" \
              --format='value(spec.template.metadata.annotations["run.googleapis.com/cloudsql-instances"])' 2>&1); then
            if [[ "$ATTACHED" == *"Cannot find service"* ]]; then
              echo "No travelwell-backend service yet, so nothing to detach."
              exit 0
            fi
            echo "Could not read the current Cloud SQL attachment, so a detach cannot be ruled out:" >&2
            echo "$ATTACHED" >&2
            exit 1
          fi
          if [[ -n "$ATTACHED" ]]; then
            echo "DB_TARGET is external but $ATTACHED is attached." >&2
            echo "This deploy would detach it. Set DB_TARGET=cloudsql, or detach on purpose first." >&2
            exit 1
          fi

      # Both the "attach nothing" flags below make gcloud require this API and
      # prompt for it. A project with it off can have nothing attached, so on
      # that path the flags are dropped rather than passed empty.
      - name: Detect Cloud SQL API
        run: |
          if gcloud services list --enabled --format='value(config.name)' \
            | grep -qx sqladmin.googleapis.com; then
            echo "SQLADMIN_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "SQLADMIN_ENABLED=0" >> "$GITHUB_ENV"
          fi

      - name: Build and push image
        working-directory: backend
        run: |
          docker build -t "$IMAGE" --build-arg COMMIT_SHA="$SHA" .
          docker push "$IMAGE"

      # Migrations run as a Cloud Run job from the exact image being deployed,
      # before the new revision serves: a failed migration fails the deploy
      # here instead of crash-looping instances at startup.
      - name: Run migrations
        run: |
          if [[ "$DB_TARGET" == cloudsql ]]; then
            DB_FLAGS=(--set-cloudsql-instances "$CLOUDSQL_INSTANCE")
          elif [[ "$SQLADMIN_ENABLED" == 1 ]]; then
            # Clear rather than omit: an omitted flag keeps whatever the
            # previous revision had attached. Jobs have no --clear-, so the
            # empty list is how you detach.
            DB_FLAGS=(--set-cloudsql-instances "")
          else
            DB_FLAGS=()
          fi
          gcloud run jobs deploy travelwell-migrate \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            "${DB_FLAGS[@]}" \
            --set-secrets DATABASE_URL=travelwell-database-url:latest \
            --command uv \
            --args run,--no-sync,alembic,upgrade,head \
            --max-retries 0
          gcloud run jobs execute travelwell-migrate --region "$REGION" --wait

      # No --allow-unauthenticated on purpose: the IAM policy lives on the
      # service, not the revision, so it survives a redeploy untouched, and
      # passing the flag would need setIamPolicy the deployer may not hold.
      #
      # The SPA is the browser-facing origin (nginx proxies /api to us), so
      # OAuth redirects must point there rather than at this service. And ADK
      # wraps the whole app in an origin guard: any non-GET carrying an Origin
      # off this list gets a bare 403, our own /api/v1 routes included, so an
      # empty list locks every real browser out while curl still works. Cloud
      # Run answers on two hostnames and status.url reports only one, hence
      # reading the full set from the urls annotation.
      - name: Deploy service
        id: deploy
        run: |
          FRONTEND_DESC=$(gcloud run services describe travelwell-frontend --region "$REGION" \
            --format='value(status.url, metadata.annotations["run.googleapis.com/urls"])' \
            2>/dev/null || true)
          IFS=$'\t' read -r FRONTEND_URL FRONTEND_URLS <<<"$FRONTEND_DESC" || true
          FRONTEND_URLS=$(printf '%s' "${FRONTEND_URLS:-}" | tr -d '[]"')
          PUBLIC_BASE_URL="${FRONTEND_URL:-http://localhost:5173}"
          ALLOWED_ORIGINS="${FRONTEND_URLS:-$PUBLIC_BASE_URL},http://localhost:5173,http://localhost:4173"
          echo "Public base: $PUBLIC_BASE_URL"

          if [[ "$DB_TARGET" == cloudsql ]]; then
            DB_FLAGS=(--add-cloudsql-instances "$CLOUDSQL_INSTANCE")
          elif [[ "$SQLADMIN_ENABLED" == 1 ]]; then
            DB_FLAGS=(--clear-cloudsql-instances)
          else
            DB_FLAGS=()
          fi
          gcloud run deploy travelwell-backend \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            "${DB_FLAGS[@]}" \
            --set-secrets DATABASE_URL=travelwell-database-url:latest,SESSION_SECRET=travelwell-session-secret:latest \
            --set-env-vars "^@^APP_ENV=staging@SESSION_COOKIE_SECURE=1@DEMO_LOGIN_ENABLED=1@PUBLIC_BASE_URL=$PUBLIC_BASE_URL@CORS_ALLOWED_ORIGINS=$ALLOWED_ORIGINS" \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 2 \
            --memory 1Gi \
            --cpu 1

          URL=$(gcloud run services describe travelwell-backend --region "$REGION" --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # /readyz is the one path the auth gate leaves open, which is exactly so
      # this check can answer before any user exists.
      - name: Smoke test /readyz
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 10); do
            if curl -fsS "$URL/readyz" >/dev/null; then
              echo "readyz OK: $URL"
              exit 0
            fi
            sleep 5
          done
          echo "readyz never answered at $URL" >&2
          exit 1

  frontend:
    name: Deploy frontend
    needs: [backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "$AR_HOST" --quiet

      - name: Resolve image tag
        run: |
          SHA=${GITHUB_SHA::7}
          echo "IMAGE=$AR_HOST/$PROJECT_ID/travelwell/frontend:$SHA" >> "$GITHUB_ENV"

      - name: Build and push image
        working-directory: frontend
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # BACKEND_URL comes from the job above rather than a constant, so this
      # cannot drift from the service that was just deployed. VITE_API_BASE_URL
      # stays unset on purpose: an empty base keeps the SPA calling /api/v1 on
      # its own origin, which is what keeps the session cookie first-party.
      - name: Deploy service
        id: deploy
        run: |
          gcloud run deploy travelwell-frontend \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-env-vars "BACKEND_URL=${{ needs.backend.outputs.url }}" \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 2 \
            --memory 256Mi \
            --cpu 1
          URL=$(gcloud run services describe travelwell-frontend --region "$REGION" --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          SHELL_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || true)
          CONF_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/config.json" || true)
          API_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/v1/auth/demo" || true)
          echo "  SPA shell      : $SHELL_CODE"
          echo "  /config.json   : $CONF_CODE"
          echo "  /api via nginx : $API_CODE"
          {
            echo "### Deployed"
            echo
            echo "- backend: ${{ needs.backend.outputs.url }}"
            echo "- frontend: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$SHELL_CODE" == 200 && "$API_CODE" == 200 ]] || {
            echo "frontend or its /api proxy is not serving" >&2; exit 1; }
