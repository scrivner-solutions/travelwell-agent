[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]

dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    # Direct: app/agent/gemini.py builds the Vertex client on it.
    # Arrives transitively via google-adk, which is not a promise it will stay.
    "google-genai>=2.10,<3.0",
    "a2a-sdk[http-server]~=0.3.22",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    # Persistence spine (ADR-001): async SQLAlchemy + Alembic on Postgres.
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    # One driver for both: psycopg3 is async for the app, sync for Alembic.
    "psycopg[binary]>=3.2.0,<4.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "authlib>=1.6,<2.0",
    # Direct: AES-GCM for stored secrets (app/services/tokens/crypto.py).
    # Arrives transitively via authlib, which is not a promise it will stay.
    "cryptography>=43,<50",
    # Direct: ADC for Maps Platform (app/services/places/google.py). Arrives
    # transitively via google-adk[gcp], which is not a promise it will stay.
    "google-auth>=2.35,<3.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"
# Registering a marker only silences the unknown-mark warning; it deselects
# nothing without a `-m`. Until this line the live tests were excluded by
# living in tests/integration, a directory no runner names, and the marker took
# the credit - so the first marked test written in a collected directory went
# red in CI. Default it off here rather than at one CI invocation: the reason to
# skip (spends money, needs ADC) is true of a laptop too, and ci.yml already has
# two pytest calls. Opt in with `-m integration_live`, which overrides this.
addopts = "-m 'not integration_live'"
markers = [
    "integration_live: marks tests as live integration tests requiring GCP/Vertex credentials (deselect with '-m \"not integration_live\"')"
]

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


