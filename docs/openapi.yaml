openapi: 3.1.0
info:
  title: TravelWell API
  version: 1.0.0-draft
  description: |
    Contract-first API for the TravelWell frontend (see docs/FRONTEND_IMPLEMENTATION_PLAN.md,
    section 5). This spec is the only interface the frontend knows: the TypeScript client and
    all status enums are generated from this file (npm run generate:api in frontend/).

    Conventions:
    - Every enum mirrors the Postgres enum of the same name in docs/schema.sql. Enums are
      defined once here and imported everywhere; they are never re-declared by hand.
    - Errors are RFC 9457 application/problem+json with a stable machine `code`.
    - Action-creating POSTs require an Idempotency-Key header (client UUID), mirroring
      pending_actions.idempotency_key.
    - Mutating requests carry the entity's updated_at; a 409 means the agent changed state
      under the user and the client must refetch.
    - Live progress uses SSE (text/event-stream); polling is the fallback, not the default.

    Status: v1 draft agreed in Phase 0. Endpoints are implemented by the backend per phase;
    the tracking table in docs/API_CONTRACTS.md records which are live vs mocked.
servers:
  - url: /api/v1

security:
  - sessionCookie: []

tags:
  - name: auth
  - name: config
  - name: trips
  - name: plan
  - name: actions
  - name: events
  - name: explore
  - name: profile
  - name: notifications

paths:
  /config:
    get:
      tags: [config]
      operationId: getRuntimeConfig
      summary: Runtime configuration for the web client
      security: []
      responses:
        "200":
          description: Runtime config (also emitted as /config.json by entrypoint.sh)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"

  /auth/email-code:
    post:
      tags: [auth]
      operationId: requestEmailCode
      summary: Send a one-time sign-in code to an email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Code sent (or silently accepted for unknown addresses)
        default:
          $ref: "#/components/responses/Problem"

  /auth/email-code/verify:
    post:
      tags: [auth]
      operationId: verifyEmailCode
      summary: Exchange an email code for an httpOnly session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        "200":
          description: Session established; Set-Cookie carries the httpOnly session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /auth/oauth/{provider}/start:
    get:
      tags: [auth]
      operationId: startOauth
      summary: Begin an OAuth sign-in (server-side redirect flow, BFF pattern)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google]
      responses:
        "302":
          description: Redirect to the provider's consent screen

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Clear the session cookie
      responses:
        "204":
          description: Session cleared

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current authenticated user
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /trips:
    get:
      tags: [trips]
      operationId: listTrips
      summary: Trips for the current user, with derived "needs you" counts
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TripState"
      responses:
        "200":
          description: Trips ordered by start date
          content:
            application/json:
              schema:
                type: object
                required: [trips]
                properties:
                  trips:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trip"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [trips]
      operationId: createTrip
      summary: Create a trip manually
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripCreate"
      responses:
        "201":
          description: Created trip (state = confirmed, origin = manual)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        default:
          $ref: "#/components/responses/Problem"

  /trips/{tripId}:
    get:
      tags: [trips]
      operationId: getTrip
      summary: A single trip with its evidence
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: The trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        default:
          $ref: "#/components/responses/Problem"

  /trips/{tripId}/confirm:
    post:
      tags: [trips]
      operationId: confirmTrip
      summary: Confirm a detected trip
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Trip confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Problem"

  /trips/{tripId}/today:
    get:
      tags: [trips]
      operationId: getTripToday
      summary: The Today view for a trip (window card, next-up items, state line)
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Today view assembled server-side in the trip's timezone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayView"
        default:
          $ref: "#/components/responses/Problem"

  /trips/{tripId}/timeline:
    get:
      tags: [trips]
      operationId: getTripTimeline
      summary: Calendar events and plan items interleaved by time
      parameters:
        - $ref: "#/components/parameters/TripId"
        - name: day
          in: query
          required: false
          description: Trip-local date (YYYY-MM-DD); omitted = whole trip
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Timeline entries ordered by start time
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/TimelineEntry"
        default:
          $ref: "#/components/responses/Problem"

  /trips/{tripId}/plan:
    get:
      tags: [plan]
      operationId: getTripPlan
      summary: The current plan (versioned) with its items and selected options
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Current plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Problem"

  /plan-items/{itemId}/accept:
    post:
      tags: [plan]
      operationId: acceptPlanItem
      summary: Accept a suggested item into the plan
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItem"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Problem"

  /plan-items/{itemId}/select-option:
    post:
      tags: [plan]
      operationId: selectPlanItemOption
      summary: Swap the selected option for an item (no data loss, flips option_state)
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option_id, updated_at]
              properties:
                option_id:
                  type: string
                  format: uuid
                updated_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Updated item with the newly selected option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItem"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Problem"

  /plan-items/{itemId}/skip:
    post:
      tags: [plan]
      operationId: skipPlanItem
      summary: Skip or remove an item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at:
                  type: string
                  format: date-time
                remove:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Updated item (status = skipped or removed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItem"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Problem"

  /plan-items/{itemId}/provenance:
    get:
      tags: [plan]
      operationId: getPlanItemProvenance
      summary: '"How I got here": window bounds, matched preferences, rejected options'
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Provenance served from stored data, never generated client-side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provenance"
        default:
          $ref: "#/components/responses/Problem"

  /actions:
    post:
      tags: [actions]
      operationId: createAction
      summary: Propose an action (reservation, calendar write) for approval
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionCreate"
      responses:
        "201":
          description: Proposed action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"
        default:
          $ref: "#/components/responses/Problem"

  /actions/{actionId}:
    get:
      tags: [actions]
      operationId: getAction
      summary: A pending action (polling fallback for the SSE stream)
      parameters:
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: The action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"
        default:
          $ref: "#/components/responses/Problem"

  /actions/{actionId}/approve:
    post:
      tags: [actions]
      operationId: approveAction
      summary: Approve a proposed action for execution
      parameters:
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Action approved (status = approved, then executing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Problem"

  /actions/{actionId}/events:
    get:
      tags: [actions]
      operationId: streamActionEvents
      summary: SSE stream of an executing action's progress
      description: |
        text/event-stream. Event types: `trace` (purposeful progress copy),
        `status` (action_status change), `result` (terminal payload), `error`.
        Data payloads follow StreamEvent.
      parameters:
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
        default:
          $ref: "#/components/responses/Problem"

  /events:
    post:
      tags: [events]
      operationId: submitEvent
      summary: Submit a user event (voice, text, or UI intent) to the agent event spine
      description: Voice, text, and taps are the same pipeline; nothing invokes the agent directly.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "202":
          description: Event accepted; if it starts a run, the reference is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRef"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}:
    get:
      tags: [events]
      operationId: getRun
      summary: An agent run (polling fallback for the SSE stream)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/events:
    get:
      tags: [events]
      operationId: streamRunEvents
      summary: SSE stream of a live agent run
      description: |
        text/event-stream, the re-homed version of the prototype's proven
        /api/events/{session_id} channel. Event types: `trace`, `status`,
        `result` (structured run output, never markdown), `error`.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
        default:
          $ref: "#/components/responses/Problem"

  /explore:
    get:
      tags: [explore]
      operationId: explore
      summary: Place candidates for the Explore map, filtered by category and preferences
      parameters:
        - name: trip_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PlaceKind"
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Surfaced candidates (cached server-side in places)
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items:
                      $ref: "#/components/schemas/Place"
        default:
          $ref: "#/components/responses/Problem"

  /resolve_location:
    get:
      tags: [explore]
      operationId: resolveLocation
      summary: Resolve a free-text location to coordinates (kept from the prototype)
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Best-effort geocoding result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedLocation"
        default:
          $ref: "#/components/responses/Problem"

  /me/preferences:
    get:
      tags: [profile]
      operationId: getPreferences
      summary: Wellness preferences and autonomy toggles
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [profile]
      operationId: updatePreferences
      summary: Update preferences (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        default:
          $ref: "#/components/responses/Problem"

  /me/sources:
    get:
      tags: [profile]
      operationId: listConnectedSources
      summary: Connected calendar/email sources with real connection status
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectedSource"
        default:
          $ref: "#/components/responses/Problem"

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Notification inbox
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        default:
          $ref: "#/components/responses/Problem"

  /notifications/{notificationId}/opened:
    post:
      tags: [notifications]
      operationId: markNotificationOpened
      summary: Record that a notification was opened (deep-link tracking)
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Recorded
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: twl_session
      description: httpOnly session cookie issued by the backend (BFF pattern); never readable by JS.

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; mirrors pending_actions.idempotency_key so retries are safe.
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: RFC 9457 problem details with a stable machine code
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The entity changed since the client last read it (agent replan, another device). Refetch and re-present.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # -- Enums: mirror docs/schema.sql 1:1; never re-declare in application code --
    AuthProvider:
      type: string
      enum: [google, apple, email]
    SourceKind:
      type: string
      enum: [google_calendar, gmail, apple_calendar, manual_import]
    SourceStatus:
      type: string
      enum: [connected, error, revoked]
    TripState:
      type: string
      enum: [detected, confirmed, upcoming, preparing, active, completed, archived, dismissed]
    TripOrigin:
      type: string
      enum: [calendar_detection, manual, import]
    PlaceKind:
      type: string
      enum: [workout, food, outdoor, recovery, lodging]
    WindowStatus:
      type: string
      enum: [open, filled, expired, superseded]
    PlanStatus:
      type: string
      enum: [draft, proposed, partially_accepted, accepted, superseded]
    ItemStatus:
      type: string
      enum: [suggested, awaiting_user, planned, confirmed, working, changed, skipped, removed]
    ItemKind:
      type: string
      enum: [activity, meal]
    OptionState:
      type: string
      enum: [selected, alternative, rejected]
    ReservationProvider:
      type: string
      enum: [travelwell, opentable, external_link]
    ReservationStatus:
      type: string
      enum: [pending, holding, confirmed, failed, canceled]
    ActionType:
      type: string
      enum: [make_reservation, cancel_reservation, create_calendar_event, update_calendar_event, delete_calendar_event, send_invite]
    ActionStatus:
      type: string
      enum: [proposed, approved, executing, completed, failed, canceled]
    EventKind:
      type: string
      enum: [scheduled_activation, scheduled_daily, user_text, user_voice, ui_action, calendar_changed, trip_changed, reservation_changed, external_context]
    RunKind:
      type: string
      enum: [pretrip_plan, replan_conflict, user_request, reservation_flow, daily_checkin, trip_detection]
    RunStatus:
      type: string
      enum: [running, completed, failed, canceled]
    NotificationStatus:
      type: string
      enum: [pending, sent, opened, dismissed]

    # -- Core resources --
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable machine code the client maps to honest failure states (e.g. reservation_declined).

    RuntimeConfig:
      type: object
      required: [api_base_url]
      properties:
        api_base_url:
          type: string
        maps_browser_key:
          type: string
        push_public_key:
          type: string
          description: VAPID/FCM public key for Web Push subscription.

    User:
      type: object
      required: [id, email, auth_provider, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        auth_provider:
          $ref: "#/components/schemas/AuthProvider"
        created_at:
          type: string
          format: date-time

    TripCreate:
      type: object
      required: [destination_name, starts_on, ends_on]
      properties:
        destination_name:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        lodging_name:
          type: string

    Trip:
      type: object
      required: [id, state, origin, destination_name, timezone, starts_on, ends_on, needs_you_count, updated_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/TripState"
        origin:
          $ref: "#/components/schemas/TripOrigin"
        destination_name:
          type: string
        timezone:
          type: string
          description: IANA zone; all trip times render in this zone, never the device zone.
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        detection_confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          description: '"Based on" rows for the detection card.'
          items:
            $ref: "#/components/schemas/TripEvidence"
        state_line:
          type: string
          description: Real trust indicator ("Active - watching your schedule"), server-derived.
        needs_you_count:
          type: integer
          description: Derived from open plan_items / pending_actions; never computed client-side.
        updated_at:
          type: string
          format: date-time

    TripEvidence:
      type: object
      required: [source, summary]
      properties:
        source:
          $ref: "#/components/schemas/SourceKind"
        summary:
          type: string

    TodayView:
      type: object
      required: [trip_id, day_label, state_word, next_up, timezone]
      properties:
        trip_id:
          type: string
          format: uuid
        day_label:
          type: string
          description: Server-derived ("Day 2 of 4 - Chicago").
        state_word:
          type: string
        timezone:
          type: string
        window:
          $ref: "#/components/schemas/WellnessWindow"
        next_up:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"

    WellnessWindow:
      type: object
      required: [status, starts_at, ends_at, bounds]
      properties:
        status:
          $ref: "#/components/schemas/WindowStatus"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        bounds:
          type: array
          description: The calendar constraints that define the window ("after your 3pm review").
          items:
            type: string

    TimelineEntry:
      type: object
      required: [entry_type, starts_at]
      properties:
        entry_type:
          type: string
          enum: [calendar_event, plan_item]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        calendar_event:
          $ref: "#/components/schemas/CalendarEventSummary"
        plan_item:
          $ref: "#/components/schemas/PlanItem"

    CalendarEventSummary:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        location_name:
          type: string

    Plan:
      type: object
      required: [id, trip_id, version, status, headline, items, updated_at]
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          $ref: "#/components/schemas/PlanStatus"
        headline:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        updated_at:
          type: string
          format: date-time

    PlanItem:
      type: object
      required: [id, kind, status, title, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ItemKind"
        status:
          $ref: "#/components/schemas/ItemStatus"
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        why:
          type: array
          description: Matched preferences served from plan_item_options.matched_preferences.
          items:
            type: string
        selected_option:
          $ref: "#/components/schemas/PlanItemOption"
        reservation:
          $ref: "#/components/schemas/Reservation"
        updated_at:
          type: string
          format: date-time

    PlanItemOption:
      type: object
      required: [id, state, place]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/OptionState"
        place:
          $ref: "#/components/schemas/Place"
        matched_preferences:
          type: array
          items:
            type: string
        rejection_reason:
          type: string
          description: Required by schema CHECK when state = rejected.

    Provenance:
      type: object
      required: [item_id, window, considered]
      properties:
        item_id:
          type: string
          format: uuid
        window:
          $ref: "#/components/schemas/WellnessWindow"
        considered:
          type: array
          description: All options including rejected ones with their stored rejection_reason.
          items:
            $ref: "#/components/schemas/PlanItemOption"

    Place:
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PlaceKind"
        name:
          type: string
        rating:
          type: number
        distance_meters:
          type: integer
        walk_minutes:
          type: integer
        price_level:
          type: integer
        lat:
          type: number
        lng:
          type: number
        photo_url:
          type: string
          format: uri
        external_url:
          type: string
          format: uri

    ResolvedLocation:
      type: object
      required: [query, name, lat, lng]
      properties:
        query:
          type: string
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        timezone:
          type: string

    ActionCreate:
      type: object
      required: [action_type, trip_id]
      properties:
        action_type:
          $ref: "#/components/schemas/ActionType"
        trip_id:
          type: string
          format: uuid
        plan_item_id:
          type: string
          format: uuid
        payload:
          type: object
          description: Action-type-specific parameters (e.g. reservation time, party size).
          additionalProperties: true

    PendingAction:
      type: object
      required: [id, action_type, status, trip_id, updated_at]
      properties:
        id:
          type: string
          format: uuid
        action_type:
          $ref: "#/components/schemas/ActionType"
        status:
          $ref: "#/components/schemas/ActionStatus"
        trip_id:
          type: string
          format: uuid
        plan_item_id:
          type: string
          format: uuid
        summary:
          type: object
          description: What / when / where / cost rows for the confirm sheet, server-assembled.
          additionalProperties: true
        failure:
          $ref: "#/components/schemas/ActionFailure"
        reservation:
          $ref: "#/components/schemas/Reservation"
        updated_at:
          type: string
          format: date-time

    ActionFailure:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Place"
        external_url:
          type: string
          format: uri
          description: Honest fallback ("book directly") when the provider declines.

    Reservation:
      type: object
      required: [id, status, provider]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ReservationStatus"
        provider:
          $ref: "#/components/schemas/ReservationProvider"
        confirmation_code:
          type: string
          description: Present iff status = confirmed (schema CHECK); the UI holds the same line.
        reserved_for:
          type: string
          format: date-time
        external_url:
          type: string
          format: uri

    EventCreate:
      type: object
      required: [kind, payload]
      properties:
        kind:
          $ref: "#/components/schemas/EventKind"
        trip_id:
          type: string
          format: uuid
        payload:
          type: object
          description: Kind-specific payload (transcript text, UI intent name, etc.).
          additionalProperties: true

    RunRef:
      type: object
      required: [event_id]
      properties:
        event_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
          description: Present when the event started (or joined) an agent run.

    AgentRun:
      type: object
      required: [id, kind, status, started_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/RunKind"
        status:
          $ref: "#/components/schemas/RunStatus"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        result:
          type: object
          description: Structured run output (plan diff, cards); never free-form markdown.
          additionalProperties: true

    StreamEvent:
      type: object
      required: [event, data]
      description: Envelope for SSE payloads on run and action streams.
      properties:
        event:
          type: string
          enum: [trace, status, result, error]
        data:
          type: object
          additionalProperties: true

    Preferences:
      type: object
      required: [allow_reservations, allow_calendar_writes, allow_notifications, updated_at]
      properties:
        allow_reservations:
          type: boolean
        allow_calendar_writes:
          type: boolean
        allow_notifications:
          type: boolean
        workout_kinds:
          type: array
          items:
            type: string
        dietary:
          type: array
          items:
            type: string
        pace:
          type: string
        updated_at:
          type: string
          format: date-time

    PreferencesUpdate:
      type: object
      properties:
        allow_reservations:
          type: boolean
        allow_calendar_writes:
          type: boolean
        allow_notifications:
          type: boolean
        workout_kinds:
          type: array
          items:
            type: string
        dietary:
          type: array
          items:
            type: string
        pace:
          type: string

    ConnectedSource:
      type: object
      required: [id, kind, status]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SourceKind"
        status:
          $ref: "#/components/schemas/SourceStatus"
        connected_at:
          type: string
          format: date-time

    Notification:
      type: object
      required: [id, status, title, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/NotificationStatus"
        title:
          type: string
        body:
          type: string
        cta:
          type: object
          required: [label, deep_link]
          properties:
            label:
              type: string
            deep_link:
              type: string
              description: In-app route the notification opens (routes/ owns the URL contract).
        created_at:
          type: string
          format: date-time
